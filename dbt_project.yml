name: 'analytics_engineering'
version: '1.0.0'

# This must match one of the profile blocks in your profiles.yml
profile: 'analytics_engineering'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Configure your model layers to build in the right materializations and schemas
models:
  analytics_engineering:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts